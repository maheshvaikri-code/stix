    params:
      level: info
      flag: disclosure
      include_recipient: true
      include_purpose: true
      retention_days: 2190  # 6 years

controls:
  - "HIPAA:164.528"

regulations:
  - "HIPAA"

tags:
  - healthcare
  - phi
  - patient-rights
  - disclosure

active: true

