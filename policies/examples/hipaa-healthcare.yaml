# -----------------------------------------------------------------------------
# Policy 21: Accounting of disclosures
# -----------------------------------------------------------------------------
policy_id: hipaa-disclosure-accounting
version: "2.0.0"
priority: 45
description: |
  Track and log all disclosures of PHI to enable patients to request
  an accounting of disclosures.

scope:
  actor_type: "*"
  action: disclose_*
  resource_type: patient_data

