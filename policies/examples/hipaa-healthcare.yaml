# =============================================================================
# SECTION 4: SECURITY SAFEGUARDS (Policies 15-18)
# =============================================================================

# -----------------------------------------------------------------------------
# Policy 15: Require encryption for PHI transmission
# -----------------------------------------------------------------------------
policy_id: hipaa-encryption-required
version: "2.0.0"
priority: 10
description: |
  All PHI transmissions must be encrypted in transit as required by
  HIPAA Security Rule.

scope:
  actor_type: "*"
  action: transmit_*
  resource_type: "*"

conditions:
  require_signal:
    phiDetected: true

decision: ALLOW
reason_code: ENCRYPTED_TRANSMISSION_REQUIRED

obligations:
  - type: ENCRYPT_TRANSIT
    params:
      algorithm: AES-256-GCM
      protocol: TLS_1_3
  - type: LOG_LEVEL
    params:
      level: info

controls:
  - "HIPAA:164.312(e)(1)"
  - "HIPAA:164.312(e)(2)(ii)"

regulations:
  - "HIPAA"

tags:
  - healthcare
  - phi
  - encryption
  - security

active: true

---
# -----------------------------------------------------------------------------
# Policy 16: Audit logging requirement
# -----------------------------------------------------------------------------
policy_id: hipaa-audit-logging
version: "2.0.0"
priority: 50
description: |
  All access to PHI must be logged for audit purposes as required by
  HIPAA Security Rule.

scope:
  actor_type: "*"
  action: "*"
  resource_type: patient_data

decision: ALLOW
reason_code: AUDIT_LOGGING_APPLIED

obligations:
  - type: LOG_LEVEL
    params:
      level: info
      include_actor: true
      include_action: true
      include_resource: true
      include_timestamp: true
      retention_days: 2190  # 6 years per HIPAA

controls:
  - "HIPAA:164.312(b)"

regulations:
  - "HIPAA"

tags:
  - healthcare
  - audit
  - logging
  - security

active: true

---
# -----------------------------------------------------------------------------
# Policy 17: Session timeout for PHI access
# -----------------------------------------------------------------------------
policy_id: hipaa-session-timeout
version: "2.0.0"
priority: 40
description: |
  Enforce automatic session termination after period of inactivity
  when accessing PHI.

scope:
  actor_type: "*"
  action: access_*
  resource_type: patient_data

decision: ALLOW
reason_code: SESSION_TIMEOUT_ENFORCED

obligations:
  - type: TIME_LIMIT
    params:
      duration_minutes: 15
      warn_at_minutes: 12
      action_on_timeout: logout

controls:
  - "HIPAA:164.312(a)(2)(iii)"

regulations:
  - "HIPAA"

tags:
  - healthcare
  - security
  - session
  - timeout

active: true

---
# -----------------------------------------------------------------------------
# Policy 18: Emergency access override
# -----------------------------------------------------------------------------
policy_id: hipaa-emergency-access
version: "2.0.0"
priority: 1
description: |
  Allows emergency "break-the-glass" access to PHI in life-threatening
  situations. All such access is logged and reviewed.

scope:
  actor_type: HUMAN
  action: emergency_access
  resource_type: patient_record

conditions:
  require_actor_attr:
    role_category: healthcare_provider
  require_context:
    emergency_declared: true

decision: ALLOW
reason_code: EMERGENCY_ACCESS_GRANTED

obligations:
  - type: LOG_LEVEL
    params:
      level: warn
      flag: emergency_access
      require_followup_review: true
  - type: NOTIFY
    params:
      recipient: privacy_officer
      template: emergency_access_alert
      immediate: true
  - type: TIME_LIMIT
    params:
      duration_minutes: 30

controls:
  - "HIPAA:164.312(a)(2)(ii)"

regulations:
  - "HIPAA"

tags:
  - healthcare
  - phi
  - emergency
  - break-glass

active: true

