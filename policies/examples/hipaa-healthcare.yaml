# -----------------------------------------------------------------------------
# Policy 23: Research use of PHI
# -----------------------------------------------------------------------------
policy_id: hipaa-research-phi
version: "2.0.0"
priority: 20
description: |
  Research use of PHI requires IRB approval and either patient consent
  or a waiver of authorization.

scope:
  actor_type: "*"
  action: research_*
  resource_type: patient_data

conditions:
  require_signal:
    phiDetected: true

decision: QUARANTINE
reason_code: RESEARCH_REQUIRES_IRB

approval:
  approver_role: irb_administrator
  require_count: 1
  require_justification: true
  require_ticket: true
  timeout_hours: 72

obligations:
  - type: LOG_LEVEL
    params:
      level: info
      flag: research_use
  - type: MASK_PII
    params:
      unless_consent_given: true

controls:
  - "HIPAA:164.512(i)"

regulations:
  - "HIPAA"
  - "COMMON_RULE"

tags:
  - healthcare
  - phi
  - research
  - irb

active: true

