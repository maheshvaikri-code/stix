# -----------------------------------------------------------------------------
# Policy 25: Law enforcement disclosure
# -----------------------------------------------------------------------------
policy_id: hipaa-law-enforcement
version: "2.0.0"
priority: 10
description: |
  Strictly controls disclosure of PHI to law enforcement. Requires
  valid legal process (warrant, subpoena, court order) in most cases.

scope:
  actor_type: "*"
  action: disclose_*
  resource_type: patient_data

conditions:
  require_context:
    recipient_type: law_enforcement

decision: QUARANTINE
reason_code: LAW_ENFORCEMENT_REQUIRES_LEGAL_PROCESS

approval:
  approver_role: legal_counsel
  require_count: 1
  require_justification: true
  require_ticket: true
  timeout_hours: 24

obligations:
  - type: LOG_LEVEL
    params:
      level: warn
      flag: law_enforcement_request
  - type: NOTIFY
    params:
      recipient: privacy_officer
      template: law_enforcement_disclosure
      immediate: true

controls:
  - "HIPAA:164.512(f)"

regulations:
  - "HIPAA"

tags:
  - healthcare
  - phi
  - law-enforcement
  - legal

active: true
