reason_code: AMENDMENT_REQUEST_REVIEW

approval:
  approver_role: medical_records_manager
  require_count: 1
  require_justification: true
  timeout_hours: 168  # 7 days

obligations:
  - type: LOG_LEVEL
    params:
      level: info
      flag: amendment_request

controls:
  - "HIPAA:164.526"

regulations:
  - "HIPAA"

tags:
  - healthcare
  - phi
  - patient-rights
  - amendment

active: true

