# -----------------------------------------------------------------------------
# Policy 6: Allow PHI for Treatment
# -----------------------------------------------------------------------------
policy_id: hipaa-tpo-treatment
version: "2.0.0"
priority: 25
description: |
  Allows PHI access for direct treatment purposes by authorized healthcare
  providers as permitted under HIPAA's Treatment exception.

scope:
  actor_type: HUMAN
  action: "*"
  resource_type: patient_record

conditions:
  require_actor_attr:
    role_category: healthcare_provider
    treatment_relationship: true

decision: ALLOW
reason_code: TPO_TREATMENT_ALLOWED

obligations:
  - type: LOG_LEVEL
    params:
      level: info
      purpose: treatment
  - type: TIME_LIMIT
    params:
      duration_minutes: 60

controls:
  - "HIPAA:164.506(c)(1)"

regulations:
  - "HIPAA"

tags:
  - healthcare
  - phi
  - tpo
  - treatment

active: true

