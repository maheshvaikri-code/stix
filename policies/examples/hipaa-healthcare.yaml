# -----------------------------------------------------------------------------
# Policy 11: Restrict genetic information (GINA)
# -----------------------------------------------------------------------------
policy_id: hipaa-gina-genetic
version: "2.0.0"
priority: 5
description: |
  Genetic information requires special handling under GINA and HIPAA.
  Must not be used for employment or insurance underwriting decisions.

scope:
  actor_type: "*"
  action: "*"
  resource_type: genetic_data

decision: QUARANTINE
reason_code: GENETIC_DATA_RESTRICTED

approval:
  approver_role: genetic_counselor
  require_count: 1
  require_justification: true
  timeout_hours: 24

obligations:
  - type: LOG_LEVEL
    params:
      level: warn
      include_justification: true
  - type: NOTIFY
    params:
      recipient: privacy_officer
      template: genetic_access_notification

controls:
  - "HIPAA:164.502"
  - "GINA:Title I"
  - "GINA:Title II"

regulations:
  - "HIPAA"
  - "GINA"

tags:
  - healthcare
  - phi
  - genetic
  - gina

active: true

