# =============================================================================
# STIX Enterprise Policy Pack - HIPAA Compliance
# Comprehensive healthcare data protection policies for AI agent operations
# Version: 2.0.0 | 25 Policies
# =============================================================================

# =============================================================================
# SECTION 1: PHI ACCESS CONTROL (Policies 1-5)
# =============================================================================

# -----------------------------------------------------------------------------
# Policy 1: Block PHI access without authorization
# -----------------------------------------------------------------------------
policy_id: hipaa-phi-block-unauthorized
version: "2.0.0"
priority: 10
description: |
  Blocks access to Protected Health Information (PHI) by unauthorized actors.
  Applies to all environments and requires explicit authorization.

scope:
  actor_type: "*"
  action: "*"
  resource_type: "patient_data"

conditions:
  require_signal:
    phiDetected: true

decision: DENY
reason_code: PHI_ACCESS_DENIED

controls:
  - "HIPAA:164.502"
  - "HIPAA:164.514"
  - "SOC2:CC6.1"

regulations:
  - "HIPAA"
  - "HITECH"

tags:
  - healthcare
  - phi
  - compliance
  - hipaa
  - access-control

active: true

---
# -----------------------------------------------------------------------------
# Policy 2: Quarantine PHI access for AI agents
# -----------------------------------------------------------------------------
policy_id: hipaa-phi-quarantine
version: "2.0.0"
priority: 20
description: |
  Requires human approval for AI agents accessing PHI when they have
  a legitimate business purpose documented in the context.

scope:
  actor_type: AI_AGENT
  action: read_*
  resource_type: patient_data

conditions:
  require_signal:
    phiDetected: true

decision: QUARANTINE
reason_code: PHI_REQUIRES_APPROVAL

approval:
  approver_role: hipaa_privacy_officer
  require_count: 1
  require_justification: true
  timeout_hours: 4

obligations:
  - type: LOG_LEVEL
    params:
      level: info
  - type: MASK_PII
  - type: WATERMARK_OUTPUT

controls:
  - "HIPAA:164.502"
  - "HIPAA:164.506"
  - "SOC2:CC6.1"

regulations:
  - "HIPAA"

tags:
  - healthcare
  - phi
  - approval-required

active: true

---
# -----------------------------------------------------------------------------
# Policy 3: Allow de-identified health data
# -----------------------------------------------------------------------------
policy_id: hipaa-deidentified-allow
version: "2.0.0"
priority: 30
description: |
  Allows access to properly de-identified health data as per HIPAA Safe Harbor.

scope:
  actor_type: "*"
  action: "*"
  resource_type: health_data

conditions:
  require_resource_attr:
    deidentified: true
    method: "safe_harbor"

decision: ALLOW
reason_code: DEIDENTIFIED_DATA_ALLOWED

obligations:
  - type: LOG_LEVEL
    params:
      level: info

controls:
  - "HIPAA:164.514(b)"

regulations:
  - "HIPAA"

tags:
  - healthcare
  - deidentified
  - allowed

active: true

---
# -----------------------------------------------------------------------------
# Policy 4: Block PHI export/transmission
# -----------------------------------------------------------------------------
policy_id: hipaa-phi-no-export
version: "2.0.0"
priority: 5
description: |
  Blocks any attempt to export, transmit, or copy PHI to external systems.

scope:
  actor_type: "*"
  action: export_*
  resource_type: "*"

conditions:
  require_signal:
    phiDetected: true

decision: DENY
reason_code: PHI_EXPORT_BLOCKED

controls:
  - "HIPAA:164.312(e)(1)"
  - "HIPAA:164.312(e)(2)"

regulations:
  - "HIPAA"

tags:
  - healthcare
  - phi
  - export-control

active: true

---
# -----------------------------------------------------------------------------
# Policy 5: Restrict PHI to minimum necessary
# -----------------------------------------------------------------------------
policy_id: hipaa-minimum-necessary
version: "2.0.0"
priority: 15
description: |
  Enforces the HIPAA minimum necessary standard - only access the PHI
  required for the specific task at hand.

scope:
  actor_type: "*"
  action: read_*
  resource_type: patient_record

conditions:
  require_signal:
    phiDetected: true

decision: ALLOW
reason_code: MINIMUM_NECESSARY_ACCESS

obligations:
  - type: REDACT_FIELDS
    params:
      fields:
        - ssn
        - financial_accounts
        - genetic_data
        - psychotherapy_notes
      unless_explicitly_needed: true
  - type: LOG_LEVEL
    params:
      level: info
      include_fields_accessed: true

controls:
  - "HIPAA:164.502(b)"
  - "HIPAA:164.514(d)"

regulations:
  - "HIPAA"

tags:
  - healthcare
  - phi
  - minimum-necessary

active: true

---
