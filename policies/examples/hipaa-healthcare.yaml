# -----------------------------------------------------------------------------
# Policy 20: Patient amendment request
# -----------------------------------------------------------------------------
policy_id: hipaa-patient-amendment
version: "2.0.0"
priority: 25
description: |
  Patients have the right to request amendments to their medical records.
  This policy requires proper workflow for amendment requests.

scope:
  actor_type: HUMAN
  action: request_amendment
  resource_type: patient_record

conditions:
