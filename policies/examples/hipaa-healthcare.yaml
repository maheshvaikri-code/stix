# =============================================================================
# SECTION 5: PATIENT RIGHTS (Policies 19-22)
# =============================================================================

# -----------------------------------------------------------------------------
# Policy 19: Patient access to own records
# -----------------------------------------------------------------------------
policy_id: hipaa-patient-access
version: "2.0.0"
priority: 20
description: |
  Patients have the right to access their own medical records under HIPAA.
  This policy enables that access.

scope:
  actor_type: HUMAN
  action: read_*
  resource_type: patient_record

conditions:
  require_actor_attr:
    is_patient: true
  require_resource_attr:
    patient_id: "$actor.patient_id"

decision: ALLOW
reason_code: PATIENT_SELF_ACCESS

obligations:
  - type: LOG_LEVEL
    params:
      level: info
      flag: patient_self_access

controls:
  - "HIPAA:164.524"

regulations:
  - "HIPAA"

tags:
  - healthcare
  - phi
  - patient-rights
  - access

active: true

