# =============================================================================
# SECTION 1: PCI-DSS CARDHOLDER DATA (Policies 1-6)
# =============================================================================

# -----------------------------------------------------------------------------
# Policy 1: Block credit card data access
# -----------------------------------------------------------------------------
policy_id: pci-block-card-data
version: "2.0.0"
priority: 5
description: |
  Blocks direct access to primary account numbers (PAN) and cardholder data.
  AI agents should never have direct access to unmasked card numbers.

scope:
  actor_type: AI_AGENT
  action: "*"
  resource_type: payment_card

conditions:
  require_signal:
    pciDetected: true

decision: DENY
reason_code: PCI_DATA_BLOCKED

controls:
  - "PCI-DSS:3.4"
  - "PCI-DSS:7.1"
  - "SOC2:CC6.1"

regulations:
  - "PCI-DSS"

tags:
  - financial
  - pci
  - card-data

active: true

---
# -----------------------------------------------------------------------------
# Policy 2: Allow tokenized payment operations
# -----------------------------------------------------------------------------
policy_id: pci-allow-tokenized
version: "2.0.0"
priority: 50
description: |
  Allows operations on tokenized payment data where actual card numbers
  have been replaced with secure tokens.

scope:
  actor_type: "*"
  action: process_payment
  resource_type: payment_token

decision: ALLOW
reason_code: TOKENIZED_PAYMENT_ALLOWED

obligations:
  - type: LOG_LEVEL
    params:
      level: info
  - type: ENCRYPT_TRANSIT

controls:
  - "PCI-DSS:3.4"
  - "PCI-DSS:4.1"

regulations:
  - "PCI-DSS"

tags:
  - financial
  - pci
  - tokenized

active: true

---
# -----------------------------------------------------------------------------
# Policy 3: Require encryption for card data transmission
# -----------------------------------------------------------------------------
policy_id: pci-encrypt-transmission
version: "2.0.0"
priority: 8
description: |
  All cardholder data transmissions must use strong cryptography
  as required by PCI-DSS Requirement 4.

scope:
  actor_type: "*"
  action: transmit_*
  resource_type: "*"

conditions:
  require_signal:
    pciDetected: true

decision: ALLOW
reason_code: PCI_ENCRYPTED_TRANSMISSION

obligations:
  - type: ENCRYPT_TRANSIT
    params:
      algorithm: AES-256-GCM
      protocol: TLS_1_3
  - type: LOG_LEVEL
    params:
      level: info
      include_destination: true

controls:
  - "PCI-DSS:4.1"
  - "PCI-DSS:4.2"

regulations:
  - "PCI-DSS"

tags:
  - financial
  - pci
  - encryption

active: true

---
# -----------------------------------------------------------------------------
# Policy 4: Restrict cardholder data retention
# -----------------------------------------------------------------------------
policy_id: pci-data-retention
version: "2.0.0"
priority: 10
description: |
  Prohibits storing sensitive authentication data after authorization.
  CVV/CVC, full track data, and PIN blocks must never be stored.

scope:
  actor_type: "*"
  action: store_*
  resource_type: payment_card

conditions:
  require_resource_attr:
    data_type:
      - cvv
      - cvc
      - track_data
      - pin_block

decision: DENY
reason_code: SENSITIVE_AUTH_DATA_NO_STORE

controls:
  - "PCI-DSS:3.2"
  - "PCI-DSS:3.2.1"
  - "PCI-DSS:3.2.2"

regulations:
  - "PCI-DSS"

tags:
  - financial
  - pci
  - retention
  - sensitive-auth

active: true

---
# -----------------------------------------------------------------------------
# Policy 5: PCI audit logging requirement
# -----------------------------------------------------------------------------
policy_id: pci-audit-logging
version: "2.0.0"
priority: 45
description: |
  All access to cardholder data must be logged and tracked for audit.
  Logs must be retained for at least one year.

scope:
  actor_type: "*"
  action: "*"
  resource_type: payment_*

decision: ALLOW
reason_code: PCI_AUDIT_LOGGED

obligations:
  - type: LOG_LEVEL
    params:
      level: info
      include_actor: true
      include_action: true
      include_resource: true
      include_timestamp: true
      retention_days: 365

controls:
  - "PCI-DSS:10.1"
  - "PCI-DSS:10.2"
  - "PCI-DSS:10.7"

regulations:
  - "PCI-DSS"

tags:
  - financial
  - pci
  - audit
  - logging

active: true

---
# -----------------------------------------------------------------------------
# Policy 6: Block PCI scope expansion
# -----------------------------------------------------------------------------
policy_id: pci-scope-containment
version: "2.0.0"
priority: 3
description: |
  Prevents AI agents from copying cardholder data to systems outside
  the designated cardholder data environment (CDE).

scope:
  actor_type: AI_AGENT
  action: copy_*
  resource_type: "*"

conditions:
  require_signal:
    pciDetected: true
  require_context:
    destination_in_cde: false

decision: DENY
reason_code: PCI_SCOPE_VIOLATION

controls:
  - "PCI-DSS:1.3"
  - "PCI-DSS:2.4"

regulations:
  - "PCI-DSS"

tags:
  - financial
  - pci
  - scope
  - segmentation

active: true

---
# =============================================================================
# SECTION 2: SOX FINANCIAL CONTROLS (Policies 7-12)
# =============================================================================

# -----------------------------------------------------------------------------
# Policy 7: Quarantine financial report generation
# -----------------------------------------------------------------------------
policy_id: sox-quarantine-reports
version: "2.0.0"
priority: 20
description: |
  Requires dual approval for AI agents generating financial reports
  that may be used for regulatory filings.

scope:
  actor_type: AI_AGENT
  action: generate_report
  resource_type: financial_*

conditions:
  env: prod
  require_resource_attr:
    regulatory: true

decision: QUARANTINE
reason_code: FINANCIAL_REPORT_APPROVAL

approval:
  approver_role: finance_controller
  require_count: 2
  require_justification: true
  timeout_hours: 24

obligations:
  - type: WATERMARK_OUTPUT
    params:
      text: "AI-GENERATED - REQUIRES REVIEW"
  - type: DUAL_CONTROL

controls:
  - "SOX:302"
  - "SOX:404"
  - "SOC2:CC7.2"

regulations:
  - "SOX"

tags:
  - financial
  - sox
  - reporting
  - dual-control

active: true

---
# -----------------------------------------------------------------------------
# Policy 8: Block production database modifications
# -----------------------------------------------------------------------------
policy_id: sox-block-prod-modify
version: "2.0.0"
priority: 1
description: |
  Blocks AI agents from directly modifying production financial databases.
  All changes must go through approved change management processes.

scope:
  actor_type: AI_AGENT
  action: "write_*"
  resource_type: database

conditions:
  env: prod
  require_resource_attr:
    contains_financial_data: true

decision: DENY
reason_code: PROD_FINANCIAL_WRITE_BLOCKED

controls:
  - "SOX:404"
  - "SOC2:CC8.1"

regulations:
  - "SOX"

tags:
  - financial
  - sox
  - production
  - write-protection

active: true

---
# -----------------------------------------------------------------------------
# Policy 9: Allow read-only financial analytics
# -----------------------------------------------------------------------------
policy_id: sox-allow-analytics-read
version: "2.0.0"
priority: 60
description: |
  Allows AI agents to read financial data for analytics purposes
  with appropriate logging and rate limiting.

scope:
  actor_type: AI_AGENT
  action: "read_*"
  resource_type: financial_analytics

decision: ALLOW
reason_code: ANALYTICS_READ_ALLOWED

obligations:
  - type: LOG_LEVEL
    params:
      level: info
  - type: RATE_LIMIT
    params:
      requests_per_minute: 100
  - type: REDACT_FIELDS
    params:
      fields:
        - ssn
        - account_number
        - routing_number

controls:
  - "SOC2:CC6.1"
  - "SOC2:CC7.2"

regulations:
  - "SOX"

tags:
  - financial
  - analytics
  - read-only

active: true

---
# -----------------------------------------------------------------------------
# Policy 10: SOX segregation of duties
# -----------------------------------------------------------------------------
policy_id: sox-segregation-duties
version: "2.0.0"
priority: 15
description: |
  Enforces segregation of duties - the same actor cannot both
  initiate and approve financial transactions.

scope:
  actor_type: "*"
  action: approve_transaction
  resource_type: financial_transaction

conditions:
  require_context:
    approver_is_initiator: true

decision: DENY
reason_code: SOD_VIOLATION_SELF_APPROVAL

controls:
  - "SOX:404"
  - "SOC2:CC5.2"
  - "COSO:Control Activities"

regulations:
  - "SOX"

tags:
  - financial
  - sox
  - segregation-duties
  - internal-control

active: true

---
# -----------------------------------------------------------------------------
# Policy 11: Require change management for GL modifications
# -----------------------------------------------------------------------------
policy_id: sox-gl-change-control
version: "2.0.0"
priority: 12
description: |
  All modifications to the General Ledger require change management
  approval and documentation.

scope:
  actor_type: "*"
  action: modify_*
  resource_type: general_ledger

decision: QUARANTINE
reason_code: GL_CHANGE_REQUIRES_APPROVAL

approval:
  approver_role: controller
  require_count: 1
  require_ticket: true
  require_justification: true
  timeout_hours: 48

obligations:
  - type: LOG_LEVEL
    params:
      level: warn
      flag: gl_modification
  - type: NOTIFY
    params:
      recipient: internal_audit
      template: gl_change_notification

controls:
  - "SOX:404"
  - "SOX:302"
  - "SOC2:CC6.6"

regulations:
  - "SOX"

tags:
  - financial
  - sox
  - general-ledger
  - change-control

active: true

---
# -----------------------------------------------------------------------------
# Policy 12: Financial period close controls
# -----------------------------------------------------------------------------
policy_id: sox-period-close
version: "2.0.0"
