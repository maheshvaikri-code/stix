# -----------------------------------------------------------------------------
# Policy 21: Need-to-know financial data access
# -----------------------------------------------------------------------------
policy_id: fin-need-to-know
version: "2.0.0"
priority: 30
description: |
  Financial data access is restricted based on job function
  and business need. Enforces least privilege principle.

scope:
  actor_type: "*"
  action: read_*
  resource_type: financial_data

decision: ALLOW
reason_code: NEED_TO_KNOW_ACCESS

obligations:
  - type: LOG_LEVEL
    params:
      level: info
      include_purpose: true
  - type: REDACT_FIELDS
    params:
      fields:
        - full_account_number
        - ssn
        - tax_id
      unless_explicitly_authorized: true

controls:
  - "SOX:404"
  - "PCI-DSS:7.1"
  - "SOC2:CC6.1"

regulations:
  - "SOX"
  - "PCI-DSS"

tags:
  - financial
  - access-control
  - least-privilege

active: true

