# -----------------------------------------------------------------------------
# Policy 14: Large transaction reporting threshold
# -----------------------------------------------------------------------------
policy_id: aml-large-transaction
version: "2.0.0"
priority: 20
description: |
  Transactions above reporting thresholds require additional
  documentation and compliance review.

scope:
  actor_type: "*"
  action: process_transaction
  resource_type: financial_transaction

conditions:
  require_resource_attr:
    amount_usd_gte: 10000

decision: QUARANTINE
reason_code: CTR_THRESHOLD_EXCEEDED

approval:
  approver_role: bsa_officer
  require_count: 1
  require_justification: true
  timeout_hours: 24

obligations:
  - type: LOG_LEVEL
    params:
      level: warn
      flag: ctr_threshold
  - type: NOTIFY
    params:
      recipient: compliance_team
      template: large_transaction_alert

controls:
  - "BSA:CTR"
  - "FinCEN:Currency Transaction"

regulations:
  - "BSA"
  - "AML"

tags:
  - financial
  - aml
  - ctr
  - reporting

active: true

