# -----------------------------------------------------------------------------
# Policy 18: Privileged access to financial systems
# -----------------------------------------------------------------------------
policy_id: fin-privileged-access
version: "2.0.0"
priority: 10
description: |
  Privileged access to financial systems requires multi-factor
  authentication and session logging.

scope:
  actor_type: "*"
  action: admin_*
  resource_type: financial_system

conditions:
  require_actor_attr:
    mfa_verified: false

decision: DENY
reason_code: MFA_REQUIRED_FOR_PRIVILEGED

controls:
  - "SOX:404"
  - "PCI-DSS:8.3"
  - "SOC2:CC6.1"

regulations:
  - "SOX"
  - "PCI-DSS"

tags:
  - financial
  - access-control
  - mfa
  - privileged

active: true

---
# -----------------------------------------------------------------------------
# Policy 19: Time-based access restrictions
# -----------------------------------------------------------------------------
policy_id: fin-time-restrictions
version: "2.0.0"
priority: 25
description: |
  Access to sensitive financial systems is restricted to
  business hours unless emergency access is invoked.

scope:
  actor_type: AI_AGENT
  action: "*"
  resource_type: financial_system

conditions:
  require_context:
    business_hours: false
    emergency_access: false

decision: DENY
reason_code: OUTSIDE_BUSINESS_HOURS

controls:
  - "SOC2:CC6.1"

regulations:
  - "SOX"

tags:
  - financial
