  require_count: 1
  require_justification: true
  timeout_hours: 4

obligations:
  - type: LOG_LEVEL
    params:
      level: warn
      flag: period_close_access

controls:
  - "SOX:302"
  - "SOX:404"

regulations:
  - "SOX"

tags:
  - financial
  - sox
  - period-close
  - heightened-control

active: true

