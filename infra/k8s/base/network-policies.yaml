# Default deny all ingress and egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: stix
  labels:
    app.kubernetes.io/name: stix
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# Allow DNS resolution for all pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: stix
  labels:
    app.kubernetes.io/name: stix
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Enforcer network policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stix-enforcer-policy
  namespace: stix
  labels:
    app.kubernetes.io/name: stix
    app.kubernetes.io/component: enforcer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: enforcer
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    # Allow from other STIX services
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stix
      ports:
        - protocol: TCP
          port: 8080
    # Allow Prometheus scraping
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # Allow to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow to Redis
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow to Evidence service
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: evidence
      ports:
        - protocol: TCP
          port: 8081
    # Allow to Approvals service
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: approvals
      ports:
        - protocol: TCP
          port: 8082
    # Allow to OTEL collector
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 4318

