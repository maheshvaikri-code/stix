apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: stix-base

namespace: stix

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
  - pairs:
      app.kubernetes.io/part-of: stix-platform
      app.kubernetes.io/version: "1.0.0"
    includeSelectors: true
    includeTemplates: true

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - enforcer-deployment.yaml
  - evidence-deployment.yaml
  - approvals-deployment.yaml
  - dashboard-deployment.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - network-policies.yaml

images:
  - name: ghcr.io/stix-ai/stix-enforcer
    newTag: latest
  - name: ghcr.io/stix-ai/stix-evidence
    newTag: latest
  - name: ghcr.io/stix-ai/stix-approvals
    newTag: latest
  - name: ghcr.io/stix-ai/stix-dashboard
    newTag: latest
