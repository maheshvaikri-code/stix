apiVersion: apps/v1
kind: Deployment
metadata:
  name: stix-dashboard
  namespace: stix
  labels:
    app.kubernetes.io/name: stix
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: stix
      app.kubernetes.io/component: dashboard
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stix
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: stix-dashboard
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: ghcr.io/stix-ai/stix-dashboard:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: NEXT_PUBLIC_ENFORCER_URL
              value: "http://stix-enforcer:8080"
            - name: NEXT_PUBLIC_EVIDENCE_URL
              value: "http://stix-evidence:8081"
            - name: NEXT_PUBLIC_APPROVALS_URL
              value: "http://stix-approvals:8082"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: stix-dashboard
  namespace: stix
  labels:
    app.kubernetes.io/name: stix
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: stix
    app.kubernetes.io/component: dashboard

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stix-dashboard
  namespace: stix
  labels:
    app.kubernetes.io/name: stix
    app.kubernetes.io/component: dashboard
