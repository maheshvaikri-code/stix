# NOTE: In production, use ExternalSecrets, SealedSecrets, or Vault
# This file serves as a template - DO NOT commit real secrets

apiVersion: v1
kind: Secret
metadata:
  name: stix-secrets
  namespace: stix
  labels:
    app.kubernetes.io/name: stix
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database credentials (use external secrets in production)
  DATABASE_URL: "postgresql://stix:CHANGE_ME@stix-postgres:5432/stix"

  # Redis credentials
  REDIS_URL: "redis://:CHANGE_ME@stix-redis:6379"

  # API Keys (generate secure random values)
  API_KEY_ENFORCER: "CHANGE_ME_ENFORCER_KEY"
  API_KEY_EVIDENCE: "CHANGE_ME_EVIDENCE_KEY"
  API_KEY_APPROVALS: "CHANGE_ME_APPROVALS_KEY"

  # JWT signing key (Ed25519 private key in PEM format)
  # Generate with: openssl genpkey -algorithm ed25519 -out private.pem
  JWT_PRIVATE_KEY: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_REAL_ED25519_PRIVATE_KEY
    -----END PRIVATE KEY-----

  # JWT public key (for token verification)
  JWT_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    REPLACE_WITH_REAL_ED25519_PUBLIC_KEY
    -----END PUBLIC KEY-----

  # Evidence signing key
  EVIDENCE_SIGNING_KEY: "CHANGE_ME_32_BYTE_HEX_KEY"

  # Encryption key for sensitive data at rest
  ENCRYPTION_KEY: "CHANGE_ME_32_BYTE_HEX_KEY"

---
apiVersion: v1
kind: Secret
metadata:
  name: stix-postgres-credentials
  namespace: stix
  labels:
    app.kubernetes.io/name: stix
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_USER: "stix"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "stix"

---
apiVersion: v1
kind: Secret
metadata:
  name: stix-redis-credentials
  namespace: stix
  labels:
    app.kubernetes.io/name: stix
    app.kubernetes.io/component: cache
type: Opaque
stringData:
  REDIS_PASSWORD: "CHANGE_ME"
