# ExternalSecrets for production - integrates with AWS Secrets Manager, Vault, etc.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stix-secrets
  namespace: stix
  labels:
    app.kubernetes.io/name: stix
    app.kubernetes.io/component: secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: stix-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DATABASE_URL: "{{ .database_url }}"
        REDIS_URL: "{{ .redis_url }}"
        API_KEY_ENFORCER: "{{ .api_key_enforcer }}"
        API_KEY_EVIDENCE: "{{ .api_key_evidence }}"
        API_KEY_APPROVALS: "{{ .api_key_approvals }}"
        JWT_PRIVATE_KEY: "{{ .jwt_private_key }}"
        JWT_PUBLIC_KEY: "{{ .jwt_public_key }}"
        EVIDENCE_SIGNING_KEY: "{{ .evidence_signing_key }}"
        ENCRYPTION_KEY: "{{ .encryption_key }}"
  data:
    - secretKey: database_url
      remoteRef:
        key: stix/production/database
        property: url
    - secretKey: redis_url
      remoteRef:
        key: stix/production/redis
        property: url
    - secretKey: api_key_enforcer
      remoteRef:
        key: stix/production/api-keys
        property: enforcer
    - secretKey: api_key_evidence
      remoteRef:
        key: stix/production/api-keys
        property: evidence
    - secretKey: api_key_approvals
      remoteRef:
        key: stix/production/api-keys
        property: approvals
    - secretKey: jwt_private_key
      remoteRef:
        key: stix/production/jwt
        property: private_key
    - secretKey: jwt_public_key
      remoteRef:
        key: stix/production/jwt
        property: public_key
    - secretKey: evidence_signing_key
      remoteRef:
        key: stix/production/signing
        property: evidence_key
    - secretKey: encryption_key
      remoteRef:
        key: stix/production/encryption
        property: key

---
# ClusterSecretStore for AWS Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
