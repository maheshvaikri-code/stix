# ServiceMonitor for Prometheus Operator
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: stix-enforcer
  namespace: stix
  labels:
    app.kubernetes.io/name: stix
    app.kubernetes.io/component: enforcer
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: stix
      app.kubernetes.io/component: enforcer
  endpoints:
    - port: metrics
      interval: 15s
      path: /metrics
      scheme: http
  namespaceSelector:
    matchNames:
      - stix

