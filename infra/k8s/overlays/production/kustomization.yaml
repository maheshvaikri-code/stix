apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: stix-production

namespace: stix

resources:
  - ../../base
  - external-secrets.yaml
  - servicemonitor.yaml

patches:
  # Increase replicas for production
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
    target:
      kind: Deployment
      name: stix-enforcer
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: stix-evidence
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: stix-approvals

  # Increase resources for production
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"
    target:
      kind: Deployment
      name: stix-enforcer

  # Update HPA for production scale
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 5
      - op: replace
        path: /spec/maxReplicas
        value: 50
    target:
      kind: HorizontalPodAutoscaler
      name: stix-enforcer-hpa

  # Update PDB for production
  - patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 3
    target:
      kind: PodDisruptionBudget
      name: stix-enforcer-pdb

configMapGenerator:
  - name: stix-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
      - RATE_LIMIT_MAX=5000
      - TRACING_SAMPLE_RATE=0.01

images:
  - name: ghcr.io/stix-ai/stix-enforcer
    newTag: v1.0.0
  - name: ghcr.io/stix-ai/stix-evidence
    newTag: v1.0.0
  - name: ghcr.io/stix-ai/stix-approvals
    newTag: v1.0.0
  - name: ghcr.io/stix-ai/stix-dashboard
    newTag: v1.0.0

commonLabels:
  environment: production
