[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eu-ai-act-governance"
version = "1.0.0"
description = "EU AI Act Compliance Governance Layer built on ISONGraph"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["eu-ai-act", "compliance", "governance", "ai-regulation", "isongraph"]

dependencies = [
    "ison-graph>=1.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
eu-ai-act = "eu_ai_act_governance.cli:main"
aiact = "eu_ai_act_governance.cli:main"

[project.urls]
Homepage = "https://github.com/ison/isongraph"
Documentation = "https://github.com/ison/isongraph/tree/main/tools/eu-ai-act-governance"
Repository = "https://github.com/ison/isongraph"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
