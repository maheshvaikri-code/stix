[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unified-governance"
version = "0.1.0"
description = "Unified governance integrating Agent, GDPR, CCPA, and PII governance for ISONGraph"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "ISONGraph Team" }
]
keywords = [
    "governance",
    "compliance",
    "gdpr",
    "ccpa",
    "pii",
    "agent",
    "privacy",
    "data-protection",
    "isongraph",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
]
dependencies = [
    "ison-graph>=1.0.0",
]

[project.optional-dependencies]
all = [
    "agent-governance>=0.1.0",
    "gdpr-governance>=0.1.0",
    "ccpa-governance>=0.1.0",
    "pii-governance>=0.1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/isongraph/unified-governance"
Documentation = "https://github.com/isongraph/unified-governance#readme"
Repository = "https://github.com/isongraph/unified-governance"

[tool.hatch.build.targets.wheel]
packages = ["src/unified_governance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/unified_governance"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]
