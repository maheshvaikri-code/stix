[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-learning"
version = "0.1.0"
description = "Agent Learning and Retraining System built on ISONGraph"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "ISON Team" }
]
keywords = [
    "agent",
    "learning",
    "retraining",
    "machine-learning",
    "llm",
    "ai",
    "isongraph",
    "graph-database",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "ison-graph>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
agent-learning = "agent_learning.cli:main"

[project.urls]
Homepage = "https://github.com/ison/agent-learning"
Documentation = "https://github.com/ison/agent-learning#readme"
Repository = "https://github.com/ison/agent-learning"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_learning"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
