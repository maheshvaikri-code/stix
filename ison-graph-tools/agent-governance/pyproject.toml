[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-governance"
version = "1.0.0"
description = "Comprehensive Governance Layer for AI Agents - Authority, Policy, Compliance, Risk, Ethics"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Mahesh Vaikri" }
]
keywords = [
    "ai-governance",
    "agent-safety",
    "compliance",
    "policy-engine",
    "audit-trail",
    "risk-management",
    "ethics",
    "isongraph",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
requires-python = ">=3.10"
dependencies = [
    "ison-graph>=1.0.0",
    "click>=8.0",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
memory = [
    "agent-memory>=1.0.0",
]

[project.scripts]
agent-governance = "agent_governance.cli:main"
agov = "agent_governance.cli:main"

[project.urls]
Homepage = "https://github.com/isongraph/agent-governance"
Documentation = "https://github.com/isongraph/agent-governance#readme"
Repository = "https://github.com/isongraph/agent-governance"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_governance"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/examples",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
