[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-memory-mcp"
version = "1.0.0"
description = "Persistent memory MCP server for AI coding agents - 12+ memory stores"
readme = "README.md"
license = "MIT"
authors = [{ name = "Mahesh Vaikri" }]
keywords = ["mcp", "agent", "memory", "coding", "context", "session", "adr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "agent-memory>=1.0.0",
]

[project.optional-dependencies]
cache = ["ison-cache>=1.0.0"]
governance = ["agent-governance>=1.0.0"]
all = ["agent-memory-mcp[cache,governance]"]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "black>=23.0.0", "ruff>=0.1.0"]

[project.scripts]
agent-memory-mcp = "agent_memory_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory_mcp"]
