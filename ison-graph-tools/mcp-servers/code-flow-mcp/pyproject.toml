[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-flow-mcp"
version = "1.0.0"
description = "Code structure analysis MCP server - flow graphs, call graphs, imports"
license = "MIT"
authors = [{ name = "Mahesh Vaikri" }]
keywords = ["mcp", "code", "analysis", "flow-graph", "call-graph", "static-analysis"]
requires-python = ">=3.10"
dependencies = ["mcp>=1.0.0", "code-flow-graph>=1.0.0", "ison-graph>=1.0.0"]

[project.scripts]
code-flow-mcp = "code_flow_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/code_flow_mcp"]
