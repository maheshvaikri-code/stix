name: Ops Cadence

on:
  schedule:
    - cron: '0 9 * * 1'
    - cron: '0 10 1 * *'
    - cron: '0 11 1 */3 *'
  workflow_dispatch:
    inputs:
      run_perf:
        description: Run performance certification profile
        required: false
        type: boolean
        default: false
      perf_url:
        description: Base URL for enforcer (required when run_perf=true)
        required: false
        default: ''
      perf_requests:
        description: Number of requests for perf run
        required: false
        default: '2000'
      perf_concurrency:
        description: Concurrency for perf run
        required: false
        default: '50'
      run_attestation:
        description: Generate quarterly attestation packet
        required: false
        type: boolean
        default: false
      run_resilience:
        description: Run resilience drill packet generation (manual only)
        required: false
        type: boolean
        default: false
      resilience_outage_seconds:
        description: Simulated evidence outage duration in seconds
        required: false
        default: '15'

permissions:
  contents: read
  actions: write

concurrency:
  group: ops-cadence-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8.12.0'

jobs:
  replay-verify:
    name: Replay and Verify Cadence Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure latest main SHA
        id: ensure-latest-main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          if [ "$GH_SHA" = "$main_sha" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Detected stale workflow SHA: $GH_SHA (latest main: $main_sha)."
          echo "Dispatching a fresh Ops Cadence run on main..."
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/ops-cadence.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Skip stale replay run
        if: steps.ensure-latest-main.outputs.skip == 'true'
        run: |
          echo "Stale workflow SHA detected and rerun dispatched on main." >> "$GITHUB_STEP_SUMMARY"
          echo "This stale run is intentionally skipped." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup pnpm
        if: steps.ensure-latest-main.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        if: steps.ensure-latest-main.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        if: steps.ensure-latest-main.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Replay and verify smoke run
        if: steps.ensure-latest-main.outputs.skip != 'true'
        run: pnpm ops:replay-smoke

      - name: Upload replay and verify artifacts
        if: steps.ensure-latest-main.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: replay-verify-cadence
          path: artifacts/ops/

  monthly-slo-packet:
    name: Monthly SLO Sign-off Packet
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate monthly sign-off template
        run: |
          month="$(date +'%Y-%m')"
          mkdir -p artifacts/ops
          node scripts/ops/generate-slo-signoff.mjs \
            --month "$month" \
            --output "artifacts/ops/slo-signoff-${month}.md"

      - name: Upload SLO sign-off packet
        uses: actions/upload-artifact@v4
        with:
          name: slo-signoff-packet
          path: artifacts/ops/

  perf-certification:
    name: Performance Certification (Optional)
    if: github.event_name == 'workflow_dispatch' && inputs.run_perf == true
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run performance profile
        env:
          PERF_URL: ${{ inputs.perf_url }}
          PERF_REQUESTS: ${{ inputs.perf_requests }}
          PERF_CONCURRENCY: ${{ inputs.perf_concurrency }}
        run: |
          if [ -z "$PERF_URL" ]; then
            echo "perf_url is required when run_perf=true"
            exit 1
          fi
          mkdir -p artifacts/perf artifacts/ops _Development_Notes
          pnpm perf:suite -- \
            --url "$PERF_URL" \
            --baseline-requests "$PERF_REQUESTS" \
            --baseline-concurrency "$PERF_CONCURRENCY" \
            --output-dir artifacts/perf
          pnpm perf:report -- \
            --input artifacts/perf/profile-suite.json \
            --output _Development_Notes/STIX_Performance_Certification.md
          cp _Development_Notes/STIX_Performance_Certification.md artifacts/ops/STIX_Performance_Certification.md

      - name: Generate SLO packet with perf summary
        run: |
          month="$(date +'%Y-%m')"
          node scripts/ops/generate-slo-signoff.mjs \
            --month "$month" \
            --perf-input artifacts/perf/profile-suite.json \
            --replay-input artifacts/ops/replay-report.md \
            --output "artifacts/ops/slo-signoff-${month}.md"

      - name: Upload performance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perf-certification
          path: artifacts/

  quarterly-attestation-packet:
    name: Quarterly Attestation Packet
    if: (github.event_name == 'workflow_dispatch' && inputs.run_attestation == true) || github.event.schedule == '0 11 1 */3 *'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate quarterly attestation packet
        run: |
          year="$(date +'%Y')"
          month="$(date +'%m')"
          quarter=$(( (10#$month - 1) / 3 + 1 ))
          packet_quarter="${year}-Q${quarter}"
          mkdir -p artifacts/ops
          node scripts/ops/generate-attestation-packet.mjs \
            --quarter "$packet_quarter" \
            --monthly-packet "artifacts/ops/slo-signoff-$(date +'%Y-%m').md" \
            --replay-report "artifacts/ops/replay-report.md" \
            --performance-report "artifacts/ops/STIX_Performance_Certification.md" \
            --output "artifacts/ops/STIX_Quarterly_Attestation_${packet_quarter}.md"

      - name: Upload quarterly attestation packet
        uses: actions/upload-artifact@v4
        with:
          name: quarterly-attestation-packet
          path: artifacts/ops/

  resilience-drill:
    name: Resilience Drill Packet (Optional)
    if: github.event_name == 'workflow_dispatch' && inputs.run_resilience == true
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start compose stack
        run: pnpm docker:up

      - name: Run resilience drill
        run: |
          mkdir -p artifacts/ops
          pnpm ops:resilience-drill -- \
            --output artifacts/ops/resilience-drill-report.md \
            --environment "github-actions-ubuntu" \
            --build-tag "${GITHUB_SHA}" \
            --enforcer-url "http://127.0.0.1:3001" \
            --policy-url "http://127.0.0.1:3002" \
            --evidence-url "http://127.0.0.1:3003" \
            --approvals-url "http://127.0.0.1:3004" \
            --preflight-timeout-seconds "180" \
            --preflight-request-timeout-ms "3000" \
            --require-all-preflight "false" \
            --outage-seconds "${{ inputs.resilience_outage_seconds }}"

      - name: Upload resilience drill artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resilience-drill-packet
          path: artifacts/ops/

      - name: Stop compose stack
        if: always()
        run: pnpm docker:down
