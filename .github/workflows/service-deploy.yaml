name: Service Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - 'packages/**'
      - 'infra/k8s/**'
  pull_request:
    branches:
      - main
    paths:
      - 'services/**'
      - 'packages/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      services:
        description: 'Services to deploy (comma-separated, or "all")'
        required: false
        default: 'all'

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: stix-ai/stix

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      services: ${{ steps.changes.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            enforcer:
              - 'services/enforcer/**'
              - 'packages/shared/**'
            evidence:
              - 'services/evidence/**'
              - 'packages/shared/**'
            approvals:
              - 'services/approvals/**'
              - 'packages/shared/**'
            dashboard:
              - 'dashboard/**'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Run linting
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=sha-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        service: [enforcer, evidence, approvals, dashboard]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        service: [enforcer, evidence, approvals, dashboard]
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:sha-${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, build-images, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: staging
      url: https://stix-staging.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Configure kubectl
        run: |
          echo "${{ secrets.STAGING_KUBECONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Deploy with Kustomize
        run: |
          cd infra/k8s/overlays/staging

          # Update image tags
          kustomize edit set image \
            ghcr.io/stix-ai/stix-enforcer=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-enforcer:sha-${{ github.sha }} \
            ghcr.io/stix-ai/stix-evidence=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-evidence:sha-${{ github.sha }} \
            ghcr.io/stix-ai/stix-approvals=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-approvals:sha-${{ github.sha }} \
            ghcr.io/stix-ai/stix-dashboard=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-dashboard:sha-${{ github.sha }}

          # Apply
          kustomize build . | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/staging-stix-enforcer -n stix-staging --timeout=300s
          kubectl rollout status deployment/staging-stix-evidence -n stix-staging --timeout=300s
          kubectl rollout status deployment/staging-stix-approvals -n stix-staging --timeout=300s
          kubectl rollout status deployment/staging-stix-dashboard -n stix-staging --timeout=300s

      - name: Run integration tests
        env:
          STIX_API_URL: ${{ secrets.STAGING_API_URL }}
          STIX_API_KEY: ${{ secrets.STAGING_API_KEY }}
        run: |
          pnpm stix-cli test integration --api-url "$STIX_API_URL"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://stix.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Configure kubectl
        run: |
          echo "${{ secrets.PRODUCTION_KUBECONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Deploy with Kustomize
        run: |
          cd infra/k8s/overlays/production

          # Use release version or sha
          VERSION="${{ needs.build.outputs.version }}"

          # Update image tags
          kustomize edit set image \
            ghcr.io/stix-ai/stix-enforcer=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-enforcer:${VERSION} \
            ghcr.io/stix-ai/stix-evidence=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-evidence:${VERSION} \
            ghcr.io/stix-ai/stix-approvals=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-approvals:${VERSION} \
            ghcr.io/stix-ai/stix-dashboard=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-dashboard:${VERSION}

          # Apply with canary rollout
          kustomize build . | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/stix-enforcer -n stix --timeout=600s
          kubectl rollout status deployment/stix-evidence -n stix --timeout=600s
          kubectl rollout status deployment/stix-approvals -n stix --timeout=600s
          kubectl rollout status deployment/stix-dashboard -n stix --timeout=600s

      - name: Verify deployment health
        run: |
          # Check all pods are ready
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=stix -n stix --timeout=300s

          # Check endpoints are healthy
          kubectl exec -n stix deploy/stix-enforcer -- wget -q -O- http://localhost:8080/health

      - name: Create deployment record
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: 'Production deployment'
            });

      - name: Notify success
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "STIX Production Deployment Successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*STIX Production Deployment*\n\n:white_check_mark: Services deployed successfully.\n\n*Version:* ${{ needs.build.outputs.version }}\n*Actor:* ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    if: failure() && needs.deploy-production.result == 'failure'
    needs: [deploy-production]
    environment:
      name: production
    steps:
      - name: Configure kubectl
        run: |
          echo "${{ secrets.PRODUCTION_KUBECONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Rollback deployments
        run: |
          kubectl rollout undo deployment/stix-enforcer -n stix
          kubectl rollout undo deployment/stix-evidence -n stix
          kubectl rollout undo deployment/stix-approvals -n stix
          kubectl rollout undo deployment/stix-dashboard -n stix

      - name: Wait for rollback
        run: |
          kubectl rollout status deployment/stix-enforcer -n stix --timeout=300s
          kubectl rollout status deployment/stix-evidence -n stix --timeout=300s

      - name: Notify rollback
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "STIX Production Rollback Executed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*STIX Production Rollback*\n\n:warning: Deployment failed, rollback executed.\n\n*Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
