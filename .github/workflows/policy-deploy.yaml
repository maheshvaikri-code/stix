name: Policy Validation

on:
  workflow_dispatch:
    inputs:
      policy_path:
        description: Path to policy folder or file
        required: true
        default: policies
      environment:
        description: Target environment label
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

concurrency:
  group: policy-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  validate:
    name: Validate policy pack
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate policy YAML
        run: node scripts/ci/validate-policies.mjs "${{ github.event.inputs.policy_path }}"

      - name: Build CLI
        run: pnpm --filter @stix/cli build

      - name: CLI smoke check
        run: node cli/dist/index.js policy --help

      - name: Upload selected policy pack
        uses: actions/upload-artifact@v4
        with:
          name: policy-pack-${{ github.event.inputs.environment }}
          path: ${{ github.event.inputs.policy_path }}
