name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8.12.0'

jobs:
  verify:
    name: Build and Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Typecheck workspace
        run: pnpm --recursive --if-present typecheck

      - name: CLI smoke checks
        run: |
          node cli/dist/index.js --help
          node cli/dist/index.js policy --help
          node cli/dist/index.js test --help

      - name: Policy YAML validation
        run: node scripts/ci/validate-policies.mjs

      - name: Combined adapter dry-run checks
        run: |
          pnpm integration:combined-adapter -- --provider bedrock --provider-input tests/fixtures/integrations/bedrock-safety.json --stix-request tests/fixtures/integrations/base-authorize-request.json --dry-run true
          pnpm integration:combined-adapter -- --provider azure --provider-input tests/fixtures/integrations/azure-safety.json --stix-request tests/fixtures/integrations/base-authorize-request.json --dry-run true
          pnpm integration:combined-adapter -- --provider vertex --provider-input tests/fixtures/integrations/vertex-safety.json --stix-request tests/fixtures/integrations/base-authorize-request.json --dry-run true
