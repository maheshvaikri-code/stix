# =============================================================================
# STIX Docker Compose - Development Environment
# =============================================================================

name: stix

services:
  # ---------------------------------------------------------------------------
  # Floci - Local AWS Emulator for FDE/Doctrine deployment drills
  # ---------------------------------------------------------------------------
  floci:
    image: floci/floci:latest
    container_name: stix-floci
    ports:
      - "${FLOCI_PORT:-4566}:4566"
    environment:
      - FLOCI_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - floci-data:/app/data
    networks:
      - stix-network

  # ---------------------------------------------------------------------------
  # STIX Enforcer - Authorization Decision Engine
  # ---------------------------------------------------------------------------
  enforcer:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: enforcer
    container_name: stix-enforcer
    ports:
      - "${STIX_ENFORCER_PORT:-3001}:3001"
    environment:
      - NODE_ENV=stage
      - PORT=3001
      - LOG_LEVEL=debug
      - LOG_PRETTY=true
      - POLICY_SERVICE_URL=http://policy:3002
      - EVIDENCE_SERVICE_URL=http://evidence:3003
      - APPROVALS_SERVICE_URL=http://approvals:3004
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEFAULT_FAIL_MODE=CLOSED
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
    depends_on:
      floci:
        condition: service_healthy
      policy:
        condition: service_healthy
      evidence:
        condition: service_healthy
      approvals:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # STIX Policy Service - Policy Evaluation Engine
  # ---------------------------------------------------------------------------
  policy:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: policy
    container_name: stix-policy
    ports:
      - "${STIX_POLICY_PORT:-3002}:3002"
    environment:
      - NODE_ENV=stage
      - PORT=3002
      - LOG_LEVEL=debug
      - LOG_PRETTY=true
      - STORAGE_TYPE=postgres
      - POSTGRES_URL=postgresql://stix:stix@postgres:5432/stix
      - POLICY_DIRECTORY=/app/policies
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
    volumes:
      - ../../policies/examples:/app/policies:ro
    depends_on:
      floci:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - stix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # STIX Evidence Service - Tamper-Evident Audit Trail
  # ---------------------------------------------------------------------------
  evidence:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: evidence
    container_name: stix-evidence
    ports:
      - "${STIX_EVIDENCE_PORT:-3003}:3003"
    environment:
      - NODE_ENV=stage
      - PORT=3003
      - LOG_LEVEL=debug
      - LOG_PRETTY=true
      - STORAGE_TYPE=postgres
      - POSTGRES_URL=postgresql://stix:stix@postgres:5432/stix
      - SIGNING_ENABLED=true
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
    depends_on:
      floci:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - stix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # STIX Approvals Service - Human-in-the-Loop Workflows
  # ---------------------------------------------------------------------------
  approvals:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: approvals
    container_name: stix-approvals
    ports:
      - "${STIX_APPROVALS_PORT:-3004}:3004"
    environment:
      - NODE_ENV=stage
      - PORT=3004
      - LOG_LEVEL=debug
      - LOG_PRETTY=true
      - STORAGE_TYPE=postgres
      - POSTGRES_URL=postgresql://stix:stix@postgres:5432/stix
      - APPROVAL_TIMEOUT_HOURS=24
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
    depends_on:
      floci:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - stix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # STIX Fabric Service - Agent Policy Fabric Control Plane
  # ---------------------------------------------------------------------------
  fabric:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: fabric
    container_name: stix-fabric
    ports:
      - "${STIX_FABRIC_PORT:-3005}:3005"
    environment:
      - NODE_ENV=stage
      - PORT=3005
      - LOG_LEVEL=debug
      - LOG_PRETTY=true
      - STORAGE_TYPE=postgres
      - POSTGRES_URL=postgresql://stix:stix@postgres:5432/stix
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
    depends_on:
      floci:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - stix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # STIX Dashboard - Fabric Console and Doctrine View
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: dashboard
    container_name: stix-dashboard
    ports:
      - "${STIX_DASHBOARD_PORT:-3100}:3100"
    environment:
      - NODE_ENV=production
      - PORT=3100
      - NEXT_PUBLIC_ENFORCER_URL=${NEXT_PUBLIC_ENFORCER_URL:-http://localhost:3001}
      - NEXT_PUBLIC_POLICY_URL=${NEXT_PUBLIC_POLICY_URL:-http://localhost:3002}
      - NEXT_PUBLIC_EVIDENCE_URL=${NEXT_PUBLIC_EVIDENCE_URL:-http://localhost:3003}
      - NEXT_PUBLIC_APPROVALS_URL=${NEXT_PUBLIC_APPROVALS_URL:-http://localhost:3004}
      - NEXT_PUBLIC_FABRIC_URL=${NEXT_PUBLIC_FABRIC_URL:-http://localhost:3005}
    depends_on:
      enforcer:
        condition: service_healthy
      policy:
        condition: service_healthy
      evidence:
        condition: service_healthy
      approvals:
        condition: service_healthy
      fabric:
        condition: service_healthy
    networks:
      - stix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis - Caching Layer
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: stix-redis
    ports:
      - "${STIX_REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - stix-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ---------------------------------------------------------------------------
  # PostgreSQL - Durable Storage Layer
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: stix-postgres
    ports:
      - "${STIX_POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=stix
      - POSTGRES_USER=stix
      - POSTGRES_PASSWORD=stix
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - stix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stix -d stix"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  stix-network:
    driver: bridge

volumes:
  floci-data:
  redis-data:
  postgres-data:
