# =============================================================================
# STIX Docker Compose - Local Development Environment
# =============================================================================
# Runs all STIX services for local development and testing
# Usage: docker compose up -d
# =============================================================================

version: "3.9"

services:
  # ===========================================================================
  # CORE SERVICES
  # ===========================================================================

  enforcer:
    build:
      context: .
      dockerfile: services/enforcer/Dockerfile
    container_name: stix-enforcer
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=dev
      - PORT=3000
      - SERVICE_NAME=stix-enforcer
      - POLICY_SERVICE_URL=http://policy:3001
      - EVIDENCE_SERVICE_URL=http://evidence:3002
      - APPROVALS_SERVICE_URL=http://approvals:3003
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=debug
    depends_on:
      - policy
      - evidence
      - redis
    networks:
      - stix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  policy:
    build:
      context: .
      dockerfile: services/policy/Dockerfile
    container_name: stix-policy
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=dev
      - PORT=3001
      - SERVICE_NAME=stix-policy
      - POSTGRES_URL=postgres://stix:stix@postgres:5432/stix_policy
      - REDIS_URL=redis://redis:6379
      - POLICY_DIR=/policies
      - LOG_LEVEL=debug
    volumes:
      - ./policies:/policies:ro
    depends_on:
      - postgres
      - redis
    networks:
      - stix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  evidence:
    build:
      context: .
      dockerfile: services/evidence/Dockerfile
    container_name: stix-evidence
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=dev
      - PORT=3002
      - SERVICE_NAME=stix-evidence
      - POSTGRES_URL=postgres://stix:stix@postgres:5432/stix_evidence
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=debug
    depends_on:
      - postgres
      - redis
    networks:
      - stix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  approvals:
    build:
      context: .
      dockerfile: services/approvals/Dockerfile
    container_name: stix-approvals
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=dev
      - PORT=3003
      - SERVICE_NAME=stix-approvals
      - POSTGRES_URL=postgres://stix:stix@postgres:5432/stix_approvals
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=debug
    depends_on:
      - postgres
      - redis
    networks:
      - stix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===========================================================================
  # TARGET SERVICES
  # ===========================================================================

  target-email:
    build:
      context: .
      dockerfile: targets/target-email/Dockerfile
    container_name: stix-target-email
    ports:
      - "3080:3080"
    environment:
      - NODE_ENV=dev
      - PORT=3080
      - SERVICE_NAME=stix-target-email
      - STIX_ENFORCER_URL=http://enforcer:3000
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMTP_FROM=stix@localhost
      - LOG_LEVEL=debug
    depends_on:
      - enforcer
      - mailhog
    networks:
      - stix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  target-http:
    build:
      context: .
      dockerfile: targets/target-http/Dockerfile
    container_name: stix-target-http
    ports:
      - "3081:3081"
    environment:
      - NODE_ENV=dev
      - PORT=3081
      - SERVICE_NAME=stix-target-http
      - STIX_ENFORCER_URL=http://enforcer:3000
      - HTTP_TIMEOUT=30000
      - HTTP_ALLOW_PRIVATE_NETWORKS=true
      - LOG_LEVEL=debug
    depends_on:
      - enforcer
    networks:
      - stix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3081/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  target-db:
    build:
      context: .
      dockerfile: targets/target-db/Dockerfile
    container_name: stix-target-db
    ports:
      - "3082:3082"
    environment:
      - NODE_ENV=dev
      - PORT=3082
      - SERVICE_NAME=stix-target-db
      - STIX_ENFORCER_URL=http://enforcer:3000
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=stix_target
      - DB_USER=stix
      - DB_PASSWORD=stix
      - LOG_LEVEL=debug
    depends_on:
      - enforcer
      - postgres
    networks:
      - stix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3082/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===========================================================================
  # INFRASTRUCTURE
  # ===========================================================================

  postgres:
    image: postgres:16-alpine
    container_name: stix-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=stix
      - POSTGRES_PASSWORD=stix
      - POSTGRES_DB=stix
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - stix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stix"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stix-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - stix-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: stix-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - stix-network

  # ===========================================================================
  # OPTIONAL: DASHBOARD
  # ===========================================================================

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: stix-dashboard
    ports:
      - "3100:3100"
    environment:
      - NODE_ENV=dev
      - PORT=3100
      - ENFORCER_URL=http://enforcer:3000
      - POLICY_URL=http://policy:3001
      - EVIDENCE_URL=http://evidence:3002
      - APPROVALS_URL=http://approvals:3003
    depends_on:
      - enforcer
      - policy
      - evidence
      - approvals
    networks:
      - stix-network
    profiles:
      - dashboard

  # ===========================================================================
  # OPTIONAL: MONITORING
  # ===========================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: stix-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - stix-network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: stix-grafana
    ports:
      - "3200:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - stix-network
    profiles:
      - monitoring

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: stix-jaeger
    ports:
      - "16686:16686"  # UI
      - "14268:14268"  # HTTP collector
      - "6831:6831/udp"  # Thrift
    networks:
      - stix-network
    profiles:
      - monitoring

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  stix-network:
    driver: bridge

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
