[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ison-memory-mcp"
version = "1.0.0"
description = "Robust ISON-based persistent memory MCP server for Claude with SQLite backend"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Mahesh Vaikri", email = "mahesh@ison.dev"}
]
keywords = [
    "ison", "mcp", "claude", "memory", "llm", "ai",
    "knowledge-graph", "sqlite", "anthropic"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database :: Database Engines/Servers",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
]

[project.scripts]
ison-memory-mcp = "ison_memory_mcp.cli:main"
ison-memory = "ison_memory_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/anthropics/ison-memory-mcp"
Documentation = "https://www.ison.dev/memory-mcp"
Repository = "https://github.com/anthropics/ison-memory-mcp"
Issues = "https://github.com/anthropics/ison-memory-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ison_memory_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "C4", "SIM"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
